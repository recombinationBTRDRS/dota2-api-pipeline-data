language: "uk"

reviews:
  profile: "assertive"
  request_changes_workflow: true
  
  instructions: |
    Це Python проект — ingestion service для Dota 2 аналітики.
    
    Архітектура має чотири шари:
    - providers/ — HTTP клієнти, адаптери зовнішніх API
    - domains/ — бізнес-логіка, DTO, парсери (НЕ знає про db/)
    - app/ — оркестрація пайплайну
    - db/ — репозиторії, SQLite моделі (НЕ знає про providers/)
    
    Перевіряй обов'язково:
    - domain шар не імпортує нічого з db/ або providers/
    - db шар не імпортує нічого з providers/
    - всі ENV змінні йдуть через settings, не hardcoded константи
    - вхідні дані валідуються через pydantic перед обробкою
    - функції роблять одну річ, не змішують відповідальності
    - нові сутності мають відповідні тести
    
    Ігноруй:
    - стилістичні зауваження якщо ruff не скаржиться
    - довжину рядків якщо це не критично для читабельності

chat:
  auto_reply: true
```

Комітиш цей файл — і CodeRabbit одразу починає враховувати ці правила.

**Що може піти не так:**
- YAML синтаксис зламаний — перевір через `yamllint` або будь-який онлайн валідатор
- Інструкції занадто розмиті — чим конкретніше описуєш правила, тим точніший review

